<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#120607"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>
  <rect width="900" height="200" fill="url(#vignette)"/>

  <!-- static corner accents -->
  <path d="M28 24 L28 50 M28 24 L56 24" stroke="#ff5a3d" stroke-width="1.5" opacity="0.55"/>
  <path d="M872 176 L872 150 M872 176 L844 176" stroke="#ff5a3d" stroke-width="1.5" opacity="0.55"/>

  <!-- name, slow breathing glow -->
  <g filter="url(#softGlow)">
    <text x="50%" y="98" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="54"
          font-weight="800" fill="url(#nameGrad)" letter-spacing="3">
      VEDANG SINGH
      <animate attributeName="opacity" values="0.88;1;0.88" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="50%" y="134" text-anchor="middle" font-family="'Courier New', monospace" font-size="15"
        fill="#c9c9c9" opacity="0.75" letter-spacing="4">
    AI &amp; DATA SCIENCE  ·  COMPUTER VISION  ·  DEEP LEARNING
  </text>

  <!-- static accent rule -->
  <rect x="375" y="152" width="150" height="2" rx="1" fill="url(#nameGrad)" opacity="0.8"/>
</svg>
